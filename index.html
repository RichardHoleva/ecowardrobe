<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to your actual Supabase project origin (set in .env as VITE_SUPABASE_URL) -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <!-- Preload the LCP logo image (served from /public) -->
    <link rel="preload" as="image" href="/logo.webp" fetchpriority="high" />

    <!-- Inline truly critical CSS so first paint doesn't wait on the CSS bundle -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0E0E0E;
        color: #e5e7eb;
        min-height: 100vh;
      }
      .glow-blur {
        position: fixed;
        background: #233E2B;
        border-radius: 50%;
        z-index: -1;
        pointer-events: none;
      }
      .glow1 { top: -50px; right: -50px; width: 200px; height: 200px; filter: blur(50px); }
      .glow2 { top: 53%; left: 30px; transform: translate(-50%, -50%); width: 200px; height: 200px; filter: blur(80px); }
      .glow3 { bottom: -150px; right: -100px; width: 300px; height: 300px; filter: blur(100px); }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"></noscript>

    <title>EcoWardrobe</title>

    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
